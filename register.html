<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Hayyak حيّاك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="auth">
    <div class="auth-card wrap intro" style="--d:1">
      <div class="auth-form">
        <a href="index.html" class="auth-logo"><img src="images/logo.png" alt="حيّاك"></a>
        <h1 data-i18n="reg_title"></h1>
        <p class="auth-sub" data-i18n="reg_sub"></p>
        <form id="register-form" novalidate>
          <p class="form-alert" role="alert" hidden></p>
        <div class="auth-field">
          <label for="fullName" data-i18n="f_name"></label>
          <div class="input-wrap">
            <span class="ico" data-icon="user"></span>
            <input id="fullName" name="fullName" type="text" autocomplete="name" data-i18n-placeholder="ph_name" aria-describedby="fullName-err" maxlength="50">
          </div>
          <p class="error" id="fullName-err" aria-live="polite"></p>
        </div>
        <div class="auth-field">
          <label for="email" data-i18n="f_email"></label>
          <div class="input-wrap">
            <span class="ico" data-icon="mail"></span>
            <input id="email" name="email" type="email" autocomplete="email" data-i18n-placeholder="ph_email" aria-describedby="email-err">
          </div>
          <p class="error" id="email-err" aria-live="polite"></p>
        </div>
        <div class="auth-field">
          <label for="password" data-i18n="f_pass"></label>
          <div class="input-wrap">
            <span class="ico" data-icon="lock"></span>
            <input id="password" name="password" type="password" autocomplete="new-password" data-i18n-placeholder="ph_pass" aria-describedby="password-err">
            <button type="button" class="pass-toggle" aria-controls="password"></button>
          </div>
          <p class="error" id="password-err" aria-live="polite"></p>
        </div>
          <ul class="pass-rules" aria-label="Password rules">
            <li data-rule="len"><span class="dot"></span><span data-i18n="rule_len"></span></li>
            <li data-rule="upper"><span class="dot"></span><span data-i18n="rule_upper"></span></li>
            <li data-rule="lower"><span class="dot"></span><span data-i18n="rule_lower"></span></li>
            <li data-rule="num"><span class="dot"></span><span data-i18n="rule_num"></span></li>
            <li data-rule="special"><span class="dot"></span><span data-i18n="rule_special"></span></li>
          </ul>
        <div class="auth-field">
          <label for="confirm" data-i18n="f_pass2"></label>
          <div class="input-wrap">
            <span class="ico" data-icon="lock"></span>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" data-i18n-placeholder="ph_pass" aria-describedby="confirm-err">
            <button type="button" class="pass-toggle" aria-controls="confirm"></button>
          </div>
          <p class="error" id="confirm-err" aria-live="polite"></p>
        </div>
          <button type="submit" class="btn btn-green btn-block" data-i18n="btn_register"></button>
        </form>
        <p class="auth-switch"><span data-i18n="have_acc"></span> <a href="login.html" data-i18n="login"></a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
