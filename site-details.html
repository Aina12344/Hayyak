<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تفاصيل الموقع | Hayyak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=reviewcards2">
</head>

<body class="over-hero">
  <div id="site-header"></div>

  <main id="main" class="sd">
    <p id="sd-error" class="sd-error wrap" role="status" hidden></p>

    <article id="sd-article" hidden>
      <!-- 1. Full-screen gallery -->
      <section class="sd-hero" aria-roledescription="carousel" aria-label="Photos">
        <div class="sd-slides" id="sd-slides"></div>
        <div class="sd-shade" aria-hidden="true"></div>

        <div class="sd-hero-in wrap">
          <a class="sd-back" href="sites.html"><span class="sd-back-ico" data-icon="chevron"></span><span data-i18n="sd_back"></span></a>
          <div class="sd-title-block">
            <p class="sd-kicker" data-reveal="up"><span id="sd-type"></span><span class="sd-dot" aria-hidden="true"></span><span id="sd-city"></span></p>
            <h1 id="sd-name" class="sd-name"></h1>
          </div>

          <div class="sd-controls" id="sd-controls">
            <div class="sd-count" aria-live="polite"><span id="sd-current">01</span><span class="sd-count-line"></span><span id="sd-total">01</span></div>
            <div class="sd-progress" aria-hidden="true"><span id="sd-progress-bar"></span></div>
            <div class="sd-arrows">
              <button type="button" class="sd-arrow prev" id="sd-prev" data-i18n-label="sd_prev"><span data-icon="chevron"></span></button>
              <button type="button" class="sd-arrow next" id="sd-next" data-i18n-label="sd_next"><span data-icon="chevron"></span></button>
            </div>
          </div>
        </div>

        <div class="sd-thumbs wrap" id="sd-thumbs"></div>
        <span class="sd-scroll" aria-hidden="true"><span></span></span>
      </section>

      <!-- 2. About + visit card -->
      <section class="sd-body wrap">
        <div class="sd-about">
          <p class="sd-eyebrow" data-reveal="up" data-i18n="sd_about"></p>
          <p id="sd-description" class="sd-lead" data-reveal="up"></p>
        </div>

        <aside class="sd-visit" data-reveal="up" aria-labelledby="sd-visit-h">
          <h2 id="sd-visit-h" data-i18n="sd_visit"></h2>
          <dl class="sd-info">
            <div><dt><span data-icon="pin"></span><span data-i18n="sd_location"></span></dt><dd id="sd-address"></dd></div>
            <div><dt><span data-icon="clock"></span><span data-i18n="sd_hours"></span></dt><dd id="sd-hours"></dd></div>
            <div><dt><span data-icon="tag"></span><span data-i18n="sd_category"></span></dt><dd id="sd-category"></dd></div>
          </dl>
          <a class="sd-map" id="sd-map" target="_blank" rel="noopener">
            <span data-icon="map"></span><span data-i18n="sd_map"></span><span class="sd-map-ext" data-icon="external"></span>
          </a>
        </aside>
      </section>

      <!-- 3. Reviews -->
      <section class="sd-reviews wrap" aria-labelledby="sd-reviews-h">
        <div class="sd-reviews-head" data-reveal="up">
          <div>
            <p class="sd-eyebrow" data-i18n="sd_reviews_eyebrow"></p>
            <h2 id="sd-reviews-h" data-i18n="sd_reviews"></h2>
          </div>
          <div class="sd-score" id="sd-score" hidden>
            <strong id="sd-avg"></strong>
            <span class="sd-score-meta"><span class="sd-stars" id="sd-avg-stars"></span><span id="sd-review-count"></span></span>
          </div>
        </div>
        <div class="sd-review-status" id="sd-review-status" role="status" aria-live="polite">جارٍ تحميل التقييمات… / Loading reviews…</div>
        <p class="sd-empty" id="sd-no-reviews" data-reveal="up" hidden>
          <span class="sd-empty-ico" data-icon="star"></span><span data-i18n="sd_no_reviews"></span>
        </p>
        <div class="sd-review-compose" id="sd-review-compose">
          <div class="sd-review-compose-intro">
            <div><p class="sd-eyebrow" data-i18n="sd_write_eyebrow"></p><h3 data-i18n="sd_write_title"></h3></div>
            <p id="sd-review-hint" class="sd-review-hint" role="status"></p>
          </div>
          <form id="sd-review-form" novalidate hidden>
            <input type="hidden" id="sd-review-edit-id">
            <fieldset class="sd-rating-picker"><legend data-i18n="sd_choose_rating"></legend>
              <div class="sd-rating-options" id="sd-rating-options" role="radiogroup" aria-label="Rating">
                <label><input type="radio" name="rating" value="1"><span>★</span><small>1</small></label>
                <label><input type="radio" name="rating" value="2"><span>★</span><small>2</small></label>
                <label><input type="radio" name="rating" value="3"><span>★</span><small>3</small></label>
                <label><input type="radio" name="rating" value="4"><span>★</span><small>4</small></label>
                <label><input type="radio" name="rating" value="5"><span>★</span><small>5</small></label>
              </div>
            </fieldset>
            <label class="sd-review-label" for="sd-review-text" data-i18n="sd_review_text"></label>
            <textarea id="sd-review-text" rows="4" maxlength="2000" required data-i18n-placeholder="sd_review_placeholder"></textarea>
            <p class="sd-review-feedback" id="sd-review-feedback" role="alert" aria-live="polite" hidden></p>
            <div class="sd-review-form-actions"><button type="submit" class="sd-review-primary" id="sd-review-submit" data-i18n="sd_post_review"></button>
              <button type="button" class="sd-review-secondary" id="sd-review-cancel" data-i18n="sd_cancel" hidden></button></div>
          </form>
          <a id="sd-review-login" class="sd-review-primary sd-review-login" href="login.html" data-i18n="sd_login_review" hidden></a>
        </div>

        <ul class="sd-review-list" id="sd-review-list" aria-live="polite" aria-label="Visitor reviews"></ul>
      </section>

      <!-- 4. More places nearby -->
      <section class="sd-more wrap" id="sd-more" aria-labelledby="sd-more-h" hidden>
        <div class="section-head" data-reveal="up">
          <h2 id="sd-more-h"></h2>
          <a class="link-more" href="sites.html"><span data-i18n="view_all"></span><span class="arrow" aria-hidden="true"></span></a>
        </div>
        <div class="sd-more-grid" id="sd-more-grid"></div>
      </section>
    </article>
  </main>

  <div id="site-footer"></div>

  <script src="js/sites.js"></script>

  <script src="js/layout.js"></script>
  <script src="js/site-details.js"></script>

  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script defer src="js/firebase-init.js"></script>
  <script defer src="js/reviews-firebase.js?v=reviewcards2"></script>
</body>
</html>
