<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تفاصيل الموقع | Hayyak</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="site-header"></div>

  <main id="main" class="section wrap details-page">
    <a class="details-back link-more" href="sites.html" data-i18n="details_back">← العودة إلى المواقع التراثية</a>
    <p id="details-error" class="details-message details-error" role="status" hidden></p>
    
    <article id="site-details" hidden>
      <section class="details-gallery">
        <div class="details-photo-wrapper">
          <button type="button" id="details-prev-btn" class="details-arrow-btn prev" aria-label="الصورة السابقة">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <img id="details-main-photo" class="details-main-photo" alt="">
          <button type="button" id="details-next-btn" class="details-arrow-btn next" aria-label="الصورة التالية">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <p id="details-photo-message" class="details-muted" hidden></p>
        <div id="details-thumbnails" class="details-thumbnails"></div>
      </section>
      
      <header class="details-heading">
        <h1 id="details-name"></h1>
        <div class="details-tags">
          <span id="details-classification" class="badge"></span>
          <span id="details-city" class="details-city-tag"></span>
        </div>
      </header>

      <section class="details-card">
        <h2 data-i18n="details_about">عن الموقع</h2>
        <p id="details-description"></p>
      </section>

      <section class="details-card">
        <h2 data-i18n="details_visit_info">معلومات الزيارة</h2>
        <dl class="details-info">
          <dt data-i18n="details_location">الموقع والعنوان</dt>
          <dd id="details-address"></dd>
          <dt data-i18n="details_hours">ساعات العمل</dt>
          <dd id="details-hours"></dd>
          <dt data-i18n="details_category">التصنيف</dt>
          <dd id="details-category"></dd>
        </dl>
      </section>

      <section class="details-card" id="details-reviews-section">
        <h2 data-i18n="details_reviews_title">تقييمات الزوار</h2>
        <p id="details-rating-summary" class="details-rating-summary" hidden></p>
        <p id="details-no-reviews" class="details-muted" data-i18n="details_no_reviews">لا توجد تقييمات لهذا الموقع بعد.</p>
        <ul id="details-review-list" class="details-review-list"></ul>
      </section>
    </article>
  </main>
  
  <div id="site-footer"></div>
  
  <script src="js/sites.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/site-details.js"></script>
</body>
</html>
