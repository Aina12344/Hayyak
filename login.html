<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Hayyak حيّاك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="auth">
    <div class="auth-card wrap intro" style="--d:1">
      <div class="auth-form">
        <a href="index.html" class="auth-logo"><img src="images/logo.png" alt="حيّاك"></a>
        <h1 data-i18n="log_title"></h1>
        <p class="auth-sub" data-i18n="log_sub"></p>
        <form id="login-form" novalidate>
          <p class="form-alert" role="alert" hidden></p>
        <div class="auth-field">
          <label for="email" data-i18n="f_email"></label>
          <div class="input-wrap">
            <span class="ico" data-icon="mail"></span>
            <input id="email" name="email" type="email" autocomplete="email" data-i18n-placeholder="ph_email" aria-describedby="email-err">
          </div>
          <p class="error" id="email-err" aria-live="polite"></p>
        </div>
        <div class="auth-field">
          <label for="password" data-i18n="f_pass"></label>
          <div class="input-wrap">
            <span class="ico" data-icon="lock"></span>
            <input id="password" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="ph_pass" aria-describedby="password-err">
            <button type="button" class="pass-toggle" aria-controls="password"></button>
          </div>
          <p class="error" id="password-err" aria-live="polite"></p>
        </div>
          <button type="submit" class="btn btn-green btn-block" data-i18n="btn_login"></button>
        </form>
        <p class="auth-switch"><span data-i18n="no_acc"></span> <a href="register.html" data-i18n="register"></a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
